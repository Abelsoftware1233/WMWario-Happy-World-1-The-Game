<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Super Mario Bros</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A Mario-style platformer built in JavaScript.">

    <link rel="stylesheet" href="css/game.css">
  </head>

  <body>
    <script src="js/util.js"></script>
    <script src="js/input.js"></script>
    <script src="js/resources.js"></script>
    <script src="js/sprite.js"></script>
    <script src="js/entity.js"></script>

    <script src="js/pipe.js"></script>
    <script src="js/mushroom.js"></script>
    <script src="js/fireflower.js"></script>
    <script src="js/star.js"></script>
    <script src="js/fireball.js"></script>
    <script src="js/coin.js"></script>
    <script src="js/bcoin.js"></script>
    <script src="js/goomba.js"></script>
    <script src="js/koopa.js"></script>
    <script src="js/floor.js"></script>
    <script src="js/block.js"></script>
    <script src="js/rubble.js"></script>
    <script src="js/prop.js"></script>
    <script src="js/flag.js"></script>

    <script src="js/player.js"></script>

    <script src="js/levels/level.js"></script>
    <script src="js/levels/11.js"></script>
    <script src="js/levels/11tunnel.js"></script>

    <script src="js/game.js"></script>

    <div class="info">
      <p class="controls">Move: Arrow Keys, Jump: X, Run: Z</p>
      <div class="links">
        My Links <br>
        <a href="www.abelsoftware123.com/payments.html"</a>
        <a href="www.abelsoftware123.com/hacktools.html</a>
        <a href="www.abelsoftware123.com" target="_blank">GitHub</a>
      </div>
    </div>
    
    <div class="touch-controls">
      <div class="dpad">
        <button id="touch-left" class="touch-btn left">◀</button>
        <button id="touch-right" class="touch-btn right">▶</button>
      </div>
      <div class="action-btns">
        <button id="touch-run" class="touch-btn run">Z/Run</button>
        <button id="touch-jump" class="touch-btn jump">X/Jump</button>
      </div>
    </div>
    
    <p class="mobile-hint">Gebruik de knoppen onderin op touch apparaten.</p>

  </body>
</html>
